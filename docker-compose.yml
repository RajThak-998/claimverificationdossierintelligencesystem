version: '3.8'

networks:
  motor_net:
    driver: bridge

volumes:
  pg_data:
  minio_data:

services:
  # ============================================================================
  # 1. Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: motor_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-motor_claims}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPostgresPass123!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - motor_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Object Storage (MinIO S3 Compatible)
  # ============================================================================
  minio:
    image: quay.io/minio/minio:latest
    profiles:
      - minio
    container_name: motor_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadminpassword123}
    volumes:
      - minio_data:/data
    networks:
      - motor_net

  # ============================================================================
  # 3. Stateless Go Backend REST API (Direct Upload & In-Memory Goroutine Workers)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: motor_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_DRIVER=postgres
      - DB_DSN=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-SecretPostgresPass123!}@postgres:5432/${DB_NAME:-motor_claims}?sslmode=disable
      - STORAGE_DRIVER=local
      - STORAGE_BASE_DIR=data/storage
      - STORAGE_BASE_URL=http://localhost:8080
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-signing-key-32chars}
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/storage:/app/data/storage
    networks:
      - motor_net

  # ============================================================================
  # 6. Frontend Dashboard (React / Vite)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motor_frontend
    restart: always
    networks:
      - motor_net

  # ============================================================================
  # 7. Reverse Proxy & SSL (Nginx)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: motor_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - motor_net
